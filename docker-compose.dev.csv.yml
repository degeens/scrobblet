# Development Docker Compose - CSV Target
# Usage: docker compose -f docker-compose.dev.csv.yml up -d --build

# This configuration builds Scrobblet locally and uses CSV as the scrobbling target.
# Scrobbles are written to /etc/scrobblet/scrobbles.csv by default.

# Scrobblet is configured via ./scrobblet.yaml (mounted read-only); secrets
# referenced with ${...} in that file come from .env.

# Access Scrobblet at http://localhost:7276

services:
  scrobblet:
    container_name: scrobblet
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - scrobblet-data:/etc/scrobblet
      - ./scrobblet.yaml:/etc/scrobblet/scrobblet.yaml:ro
    ports:
      - 7276:7276
    env_file:
      - .env
    restart: unless-stopped

volumes:
  scrobblet-data:
